name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The suite never needs the ITU corpus (tests/test_license.py forbids it), so it runs identically on every OS.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: itulib --version
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy itulib tests
      - run: python -m pytest -q
      - name: Library code must not rely on assertions
        run: python -O -c "import itulib, itulib.cli, itulib.index, itulib.text, itulib.mcp"

  core-only:
    # `pip install itulib` without the extra: library and CLI work, and `itulib mcp` explains itself.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install . pytest
      - run: itulib info
      - run: itulib browse X
      - name: itulib mcp without the extra explains itself
        run: |
          set +e
          out=$(itulib mcp 2>&1); code=$?
          set -e
          echo "$out"
          test "$code" = "2" && echo "$out" | grep -q "itulib\[mcp\]"
