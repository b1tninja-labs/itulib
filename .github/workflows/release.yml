name: release

# Tag vX.Y.Z (matching itulib/__init__.py __version__) -> build, test the built artifacts, publish to PyPI.
# "Run workflow" by hand -> TestPyPI. Publishing uses PyPI trusted publishing (OIDC, no API tokens). One-time
# setup on pypi.org / test.pypi.org: add a trusted publisher for this repository, workflow "release.yml",
# environment "pypi" / "testpypi".
#
# The sdist is built and tested from a clean extraction: it must carry everything the tests need and nothing
# from ITU, which tests/test_license.py enforces over the extracted tree.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches __version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('itulib/__init__.py').read()).group(1))")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: No ITU material in either artifact
        run: |
          # `! cmd` is exempt from errexit, so a match in the first check would be ignored; test explicitly.
          if unzip -l dist/*.whl | grep -i -E '\.(pdf|doc|docx|zip)$'; then echo "ITU-like file in wheel"; exit 1; fi
          if tar tzf dist/*.tar.gz | grep -i -E '\.(pdf|doc|docx|zip)$'; then echo "ITU-like file in sdist"; exit 1; fi
      - name: Test the wheel
        run: |
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install "$(ls dist/*.whl)[mcp]"
          /tmp/wheeltest/bin/itulib --version
          /tmp/wheeltest/bin/itulib info
      - name: Test the sdist from a clean extraction
        run: |
          mkdir /tmp/sdist && tar xzf dist/*.tar.gz -C /tmp/sdist --strip-components=1
          python -m venv /tmp/sdisttest
          /tmp/sdisttest/bin/pip install "/tmp/sdist[mcp]" pytest
          cd /tmp/sdist && /tmp/sdisttest/bin/python -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
